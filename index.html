<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomodoro de estudo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f2f4f6;--card:#fff;--ink:#16202a;--mute:#5d6975;--line:#dce2e8;--blue:#2f5d84;--blue-t:#fff;--amber:#b57a10;--amber-bg:#fbf1dc;--green:#3f8a68;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121314;--card:#1a1c1e;--ink:#e8eaed;--mute:#98a0a8;--line:#2a2d30;--blue:#365f80;--blue-t:#d7e6f3;--amber:#e8b84a;--amber-bg:#2c2513;--green:#5fb38c}}
:root[data-theme="dark"]{--bg:#121314;--card:#1a1c1e;--ink:#e8eaed;--mute:#98a0a8;--line:#2a2d30;--blue:#365f80;--blue-t:#d7e6f3;--amber:#e8b84a;--amber-bg:#2c2513;--green:#5fb38c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:1080px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media(max-width:820px){.app{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.timer{position:sticky;top:16px;text-align:center}
@media(max-width:820px){.timer{position:static}}
.mode{font-weight:600;color:var(--blue);margin:0 0 4px}
.mode.pausa{color:var(--green)}
.clock{font-size:68px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05;margin:0}
.bar{height:5px;border-radius:3px;background:var(--line);margin:14px 0 16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .9s linear}
.pausa~.bar i,.bar.pausa i{background:var(--green)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:9px 14px;font-weight:500}
.btn:hover{background:var(--bg)}
.btn.main{background:var(--blue);border-color:var(--blue);color:var(--blue-t);font-weight:600;min-width:120px}
.btn.main:hover{filter:brightness(1.1)}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cfg{display:flex;gap:12px;justify-content:center;margin-top:16px;color:var(--mute);font-size:13px}
.cfg input{width:56px;font:inherit;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);margin-left:4px}
.today{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
.today b{color:var(--ink);font-size:17px}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:9px 14px;font-weight:500;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber);font-weight:600}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.nav h2{flex:1;margin:0;font-size:18px;text-transform:capitalize}
.nav .btn{padding:6px 11px}
.grid{position:relative;height:864px;margin-left:52px;border-left:1px solid var(--line)}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.hr span{position:absolute;left:-52px;top:-9px;width:44px;text-align:right;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.blk{position:absolute;left:4px;right:6px;background:var(--blue);color:var(--blue-t);border-radius:6px;padding:4px 8px;font-size:12px;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.blk b{display:block;font-size:12px}
.blk.live{outline:2px dashed var(--amber);outline-offset:-2px}
.now{position:absolute;left:-5px;right:0;height:2px;background:#ef5b5b;z-index:2}
.now:before{content:"";position:absolute;left:0;top:-4px;width:10px;height:10px;border-radius:50%;background:#ef5b5b}
.sum{margin:14px 0 0;color:var(--mute)}
.sum b{color:var(--ink)}
.wk{display:grid;grid-template-columns:48px 1fr 64px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.wk:last-of-type{border-bottom:0}
.wk .t{height:22px;background:var(--bg);border-radius:5px;overflow:hidden}
.wk .t i{display:block;height:100%;background:var(--blue);border-radius:5px}
.wk.hoje .n{color:var(--amber);font-weight:700}
.wk .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px}
.stat small{color:var(--mute);display:block}
.stat b{font-size:22px}
.pers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 14px}
.per{border:1px solid var(--line);border-radius:10px;padding:12px}
.per.top{border-color:var(--amber);background:var(--amber-bg)}
.per small{color:var(--mute);display:block}
.per b{font-size:20px;display:block}
.hl{padding:12px 14px;border-left:3px solid var(--amber);background:var(--amber-bg);border-radius:0 8px 8px 0;margin:0 0 6px}
.days{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:8px}
.days div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mute)}
.days i{display:block;width:100%;background:var(--blue);border-radius:3px 3px 0 0;min-height:0}
h3{margin:18px 0 6px;font-size:15px}
.hd{margin:16px 0 4px;font-weight:600;text-transform:capitalize}
.hi{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.hi span{flex:1;font-variant-numeric:tabular-nums}
.hi .x{border:0;background:none;color:var(--mute);padding:4px 8px;border-radius:6px}
.hi .x:hover{background:var(--bg);color:#e05555}
.empty{color:var(--mute);padding:24px 0;text-align:center}
[hidden]{display:none!important}
.btn{position:relative}.btn:focus-within{outline:2px solid var(--amber);outline-offset:2px}
.modes{margin-bottom:14px}.seg{padding:6px 12px;font-size:13px}.seg[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-t)}.seg:disabled{opacity:.6;cursor:default}
.clock.cr{font-size:46px}
.opt{display:flex;gap:10px;align-items:center;padding:6px 0}.opt input{width:17px;height:17px}
.mf{display:flex;flex-direction:column;gap:10px;text-align:left;margin-top:10px}.mf .btn{width:100%}
.mf label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
.mf input{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.er{color:#e05555;font-size:13px;min-height:18px;margin:0 0 4px}.ok{color:var(--green)}.opt input[type=range]{width:auto;flex:1;max-width:280px;height:auto;accent-color:var(--blue)}
#tip{position:fixed;z-index:10;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:8px;font-size:13px;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.28);white-space:nowrap}#tip b{display:block}
.snd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.snd .nm{flex:1;min-width:140px}.snd small{color:var(--mute);display:block}
.hi em{color:var(--mute);font-style:normal;font-size:12px;margin-left:6px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.acct{max-width:1080px;margin:0 auto;padding:14px 16px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;color:var(--mute);font-size:13px}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(360px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dl{display:flex;flex-direction:column;gap:10px}.dl h2{margin:0;font-size:18px}
.dl label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
.dl input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121314">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div class="acct" id="acct" hidden></div>
<dialog id="upd"><div class="dl">
  <h2 id="upd-t">Nova versão disponível</h2>
  <ul id="upd-n" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px"></ul>
  <div class="row"><button class="btn main" id="upd-go">Atualizar agora</button><button class="btn" id="upd-later">Depois</button></div>
</div></dialog>
<dialog id="dlg"><div class="dl"><h2>Entrar para sincronizar</h2>
  <label>E-mail<input type="email" id="em" autocomplete="username"></label>
  <label>Senha<input type="password" id="pw" autocomplete="current-password"></label>
  <p class="er" id="dl-err" role="alert"></p>
  <div class="row"><button class="btn main" id="btn-in">Entrar</button><button class="btn" id="btn-new">Criar conta</button></div>
  <div class="row"><button class="btn" id="btn-g">Entrar com Google</button><button class="btn" id="btn-x">Cancelar</button></div>
</div></dialog>
<div class="app">
  <aside class="card timer">
    <div class="row modes"><button class="btn seg" data-ui="pomo">Pomodoro</button><button class="btn seg" data-ui="cron">Cronômetro</button><button class="btn seg" data-ui="man" title="Adicionar registro manual">Manual</button></div>
    <div id="tmr">
    <p class="mode" id="mode">Foco</p>
    <p class="clock" id="clock">25:00</p>
    <div class="bar" id="bar"><i id="prog"></i></div>
    <div class="row">
      <button class="btn main" id="go">Iniciar</button>
      <button class="btn" id="stop">Encerrar</button>
    </div>
    <div class="cfg">
      <label>Foco <input type="number" id="cf" min="1" max="180" aria-label="Minutos de foco"> min</label>
      <label>Pausa <input type="number" id="cb" min="1" max="60" aria-label="Minutos de pausa"> min</label>
    </div>
    </div>
    <div id="man" hidden>
      <p class="mode">Adicionar registro manual</p>
      <div class="mf">
        <label>Data<input type="date" id="m-d"></label>
        <label>Início<input type="time" id="m-s"></label>
        <label>Fim<input type="time" id="m-e"></label>
        <button class="btn main" data-add>Adicionar</button>
        <p class="er" id="m-err" role="status"></p>
      </div>
    </div>
    <div class="today">Hoje você estudou <b id="tday">0min</b></div>
  </aside>
  <main>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="day">Dia</button>
      <button class="tab" role="tab" data-tab="week">Semana</button>
      <button class="tab" role="tab" data-tab="month">Relatório</button>
      <button class="tab" role="tab" data-tab="hist">Histórico</button>
      <button class="tab" role="tab" data-tab="set">Avisos</button>
    </div>
    <section class="card" id="view"></section>
  </main>
</div>
<div id="tip" role="tooltip" hidden></div>
<script>
const K='pomodoro-estudo.v1';
let S={sessions:[],cfg:{focus:25,brk:5},t:null,c:{acc:0,running:false},ui:'pomo'};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.cfg=Object.assign({focus:25,brk:5,auto:false,snd:true,ntf:false,vol:80},S.cfg);S.c=S.c||{acc:0,running:false};S.ui=S.ui||'pomo';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const dur=m=>(m==='focus'?S.cfg.focus:S.cfg.brk)*60000;
if(!S.t)S.t={mode:'focus',rem:dur('focus'),running:false};
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmt=m=>{m=Math.round(m);if(m<60)return m+'min';const h=Math.floor(m/60),r=m%60;return h+'h'+(r?pad(r):'')};
const hm=t=>pad(new Date(t).getHours())+':'+pad(new Date(t).getMinutes());
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
let tab='day',A=new Date();

const KL={pomo:'Foco',cron:'Cronômetro',man:'Manual'};
let cloud=null,acct={mode:'off'};
function addSess(o){S.sessions.push(o);save();if(cloud)cloud.set(o)}
function delSess(id){S.sessions=S.sessions.filter(x=>x.id!==id);save();if(cloud)cloud.del(id)}
function pushCfg(){if(cloud){const{focus,brk,auto,snd,vol}=S.cfg;cloud.cfg({focus,brk,auto,snd,vol})}}
function setCloud(c){cloud=c}
function setAcct(a){acct=a;paintAcct()}
function localSessions(){return S.sessions}
function applySessions(a){S.sessions=a;save();paintAll()}
function applyCfg(d){for(const k of['focus','brk','auto','snd','vol'])if(d[k]!==undefined)S.cfg[k]=d[k];save();$('#cf').value=S.cfg.focus;$('#cb').value=S.cfg.brk;if(!S.t.running)S.t.rem=dur(S.t.mode);paintAll()}
function migKey(){return S.mig}
function setMig(v){S.mig=v;save()}
function clearLocal(){S.sessions=[];S.mig=null;save();paintAll()}
function paintAcct(){const el=$('#acct');
  if(acct.mode==='off'){el.hidden=true;return}
  el.hidden=false;const em=String(acct.email||'').replace(/[<>&"]/g,'');
  el.innerHTML=acct.mode==='in'?`<span>${em} · ${acct.err?'erro de sincronização':acct.pending?'sincronizando…':acct.fromCache?'offline':'sincronizado'}</span><button class="btn" data-logout>Sair</button>`:`<span>Sem conta: os registros ficam só neste aparelho.</span><button class="btn" data-login>Entrar para sincronizar</button>`}
const allowed=u=>u==='man'||(S.c.running?u==='cron':S.t.running?u==='pomo':true);
function prepMan(){const d=$('#m-d');d.value=dk(A);d.max=dk(Date.now());$('#m-err').textContent=''}
function log(s,e,k='pomo'){if(e-s>=30000){addSess({id:s+'-'+Math.round(Math.random()*1e5),s,e,k})}}
const SND={};let sndMsg='',ntfMsg='',flash='';
function setSnd(k,f,name){if(SND[k])URL.revokeObjectURL(SND[k].url);SND[k]={url:URL.createObjectURL(f),name}}
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('pomodoro-sons',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function idbSet(k,v){const d=await idb();return new Promise((ok,no)=>{const tx=d.transaction('s','readwrite'),st=tx.objectStore('s');v?st.put(v,k):st.delete(k);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}
async function idbGet(k){const d=await idb();return new Promise((ok,no)=>{const r=d.transaction('s').objectStore('s').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function rmSnd(k){try{await idbSet(k,null)}catch(e){}if(SND[k]){URL.revokeObjectURL(SND[k].url);delete SND[k]}renderView()}
(async()=>{for(const k of['focus','break']){try{const v=await idbGet(k);if(v)setSnd(k,v.f,v.name)}catch(e){}}if(tab==='set')renderView()})();
function beep(k){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();g.gain.value=S.cfg.vol/100;o.connect(g);g.connect(c.destination);o.frequency.value=k==='break'?523:784;o.start();o.stop(c.currentTime+.45)}catch(e){}}
function play(k,force){if(!S.cfg.snd&&!force)return;if(SND[k]){try{const a=new Audio(SND[k].url);a.volume=S.cfg.vol/100;a.play().catch(()=>beep(k))}catch(e){beep(k)}}else beep(k)}
function cue(k){play(k);if(S.cfg.ntf&&window.Notification&&Notification.permission==='granted'){try{new Notification(k==='focus'?'Hora de estudar':'Hora da pausa',{body:k==='focus'?'Seu período de foco começou.':'Seu período de pausa começou.'})}catch(e){}}}

function toggle(){const t=S.t,now=Date.now();
  if(t.running){if(t.mode==='focus')log(t.segStart,now);t.rem=t.end-now;t.running=false}
  else{t.end=now+t.rem;t.segStart=now;t.running=true}
  save();paintAll()}
function stopAll(){const t=S.t,now=Date.now();
  if(t.running&&t.mode==='focus')log(t.segStart,now);
  S.t={mode:'focus',rem:dur('focus'),running:false};save();paintAll()}
function complete(){const t=S.t;
  if(t.mode==='focus')log(t.segStart,t.end);
  const m=t.mode==='focus'?'break':'focus';
  S.t={mode:m,rem:dur(m),running:false};
  if(S.cfg.auto){const n=Date.now();S.t.end=n+S.t.rem;S.t.segStart=n;S.t.running=true}
  cue(m);save();paintAll()}
function cToggle(){const c=S.c,now=Date.now();
  if(c.running){log(c.segStart,now,'cron');c.acc+=now-c.segStart;c.running=false}
  else{c.segStart=now;c.running=true}
  save();paintAll()}
function cStop(){const c=S.c,now=Date.now();if(c.running)log(c.segStart,now,'cron');S.c={acc:0,running:false};save();paintAll()}
function addManual(){const d=$('#m-d').value,a=$('#m-s').value,b=$('#m-e').value,er=$('#m-err'),err=m=>{er.className='er';er.textContent=m};
  if(!d||!a||!b)return err('Informe data, início e fim.');
  const [y,mo,da]=d.split('-').map(Number),T=v=>new Date(y,mo-1,da,...v.split(':').map(Number)).getTime(),s=T(a),e=T(b);
  if(e<=s)return err('O fim precisa ser depois do início (registros não atravessam a meia-noite).');
  if(e>Date.now())return err('O registro não pode estar no futuro.');
  if(S.sessions.some(x=>s<x.e&&e>x.s))return err('Esse horário se sobrepõe a outro registro.');
  addSess({id:'m'+s+'-'+Math.round(Math.random()*1e5),s,e,k:'man'});
  save();A=new Date(y,mo-1,da);paintAll();$('#m-s').value=$('#m-e').value='';er.className='er ok';er.textContent='Registro de '+fmt((e-s)/6e4)+' adicionado.'}

function segs(){const out=[];
  const add=(s,e,k)=>{while(s<e){const d=new Date(s),n=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime(),x=Math.min(e,n);out.push({s,e:x,day:dk(s),k});s=x}};
  S.sessions.forEach(x=>add(x.s,x.e,x.k));
  const t=S.t;if(t.running&&t.mode==='focus')add(t.segStart,Date.now(),'pomo');if(S.c.running)add(S.c.segStart,Date.now(),'cron');
  return out}
const mins=l=>l.reduce((a,x)=>a+(x.e-x.s)/6e4,0);
function byDay(l){const o={};l.forEach(x=>o[x.day]=(o[x.day]||0)+(x.e-x.s)/6e4);return o}
function periods(l){const p={manha:0,tarde:0,noite:0};
  l.forEach(x=>{for(let t=x.s;t<x.e;t+=6e4){const w=Math.min(6e4,x.e-t)/6e4,h=new Date(t).getHours();p[h>=6&&h<12?'manha':h>=12&&h<18?'tarde':'noite']+=w}});
  return p}

function paintTimer(){const t=S.t,cr=S.ui==='cron'||(S.ui==='man'&&S.c.running),now=Date.now();
  let txt,ttl;
  if(cr){const c=S.c,s=Math.floor((c.acc+(c.running?now-c.segStart:0))/1000);
    txt=pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60);
    $('#mode').textContent=ttl='Cronômetro';$('#mode').className='mode';
    $('#go').textContent=c.running?'Pausar':(c.acc?'Continuar':'Iniciar');
    $('#stop').textContent=c.running||c.acc?'Finalizar':'Zerar'}
  else{const left=t.running?Math.max(0,t.end-now):t.rem,tot=dur(t.mode),s=Math.ceil(left/1000);
    txt=pad(Math.floor(s/60))+':'+pad(s%60);
    $('#mode').textContent=ttl=t.mode==='focus'?'Foco':'Pausa';
    $('#mode').className='mode'+(t.mode==='focus'?'':' pausa');
    $('#bar').className='bar'+(t.mode==='focus'?'':' pausa');
    $('#prog').style.width=(100*(1-left/tot))+'%';
    $('#go').textContent=t.running?'Pausar':(t.rem<tot?'Continuar':'Iniciar');
    $('#stop').textContent=t.running||t.rem<tot?'Encerrar':'Zerar'}
  $('#clock').textContent=txt;$('#clock').className='clock'+(cr?' cr':'');
  $('#bar').hidden=$('.cfg').hidden=cr;$('#tmr').hidden=S.ui==='man';$('#man').hidden=S.ui!=='man';
  document.querySelectorAll('.seg').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.ui===S.ui);b.disabled=!allowed(b.dataset.ui)});
  document.title=(cr?S.c.running:t.running)?txt+' · '+ttl:'Pomodoro de estudo';
  const k=dk(now);$('#tday').textContent=fmt(mins(segs().filter(x=>x.day===k)));
  $('#cf').disabled=$('#cb').disabled=t.running}

function vDay(){const key=dk(A),H=48,base=new Date(A.getFullYear(),A.getMonth(),A.getDate(),6).getTime();
  let g='';for(let h=6;h<=23;h++)g+=`<div class="hr" style="top:${(h-6)*H}px"><span>${pad(h)}:00</span></div>`;
  const l=segs().filter(x=>x.day===key);
  const live=S.t.running&&S.t.mode==='focus'?S.t.segStart:S.c.running?S.c.segStart:-1;
  l.forEach(x=>{const top=Math.max(0,(x.s-base)/36e5*H),bot=Math.min(18*H,(x.e-base)/36e5*H);if(bot<=top)return;
    const m=(x.e-x.s)/6e4;
    g+=`<div class="blk${x.s===live||(live>0&&x.e>Date.now()-2000)?' live':''}" style="top:${top}px;height:${Math.max(6,bot-top-1)}px" tabindex="0" data-k="${KL[x.k]||'Foco'}" data-a="${hm(x.s)}" data-b="${hm(x.e)}" data-d="${fmt(m)}"><b>${KL[x.k]||'Foco'}</b>${hm(x.s)} – ${hm(x.e)} · ${fmt(m)}</div>`});
  if(key===dk(Date.now())){const y=(Date.now()-base)/36e5*H;if(y>=0&&y<=18*H)g+=`<div class="now" style="top:${y}px"></div>`}
  return `<div class="nav"><h2>${A.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</h2>${nav()}</div>
  <div class="grid">${g}</div>
  <p class="sum">Total do dia: <b>${fmt(mins(l))}</b>${l.length?'':' — ainda sem registros. Inicie um foco para ver o bloco aparecer aqui.'}</p>`}

function nav(){return `<button class="btn" data-act="-1" aria-label="Anterior">‹</button><button class="btn" data-act="0">Hoje</button><button class="btn" data-act="1" aria-label="Próximo">›</button>`}

function vWeek(){const wd=(A.getDay()+6)%7,st=new Date(A.getFullYear(),A.getMonth(),A.getDate()-wd);
  const o=byDay(segs()),N=['seg','ter','qua','qui','sex','sáb','dom'],days=[];
  for(let i=0;i<7;i++){const d=new Date(st.getFullYear(),st.getMonth(),st.getDate()+i);days.push({d,k:dk(d.getTime()),m:o[dk(d.getTime())]||0,n:N[i]})}
  const mx=Math.max(60,...days.map(x=>x.m)),tot=days.reduce((a,x)=>a+x.m,0),end=days[6].d;
  return `<div class="nav"><h2>${st.toLocaleDateString('pt-BR',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('pt-BR',{day:'numeric',month:'short'})}</h2>${nav()}</div>
  ${days.map(x=>`<div class="wk${x.k===dk(Date.now())?' hoje':''}"><span class="n">${x.n}</span><div class="t"><i style="width:${100*x.m/mx}%"></i></div><span class="v">${x.m?fmt(x.m):'—'}</span></div>`).join('')}
  <p class="sum">Total da semana: <b>${fmt(tot)}</b> · média por dia: <b>${fmt(tot/7)}</b></p>`}

const PN={manha:'Manhã',tarde:'Tarde',noite:'Noite'},PR={manha:'06h–12h',tarde:'12h–18h',noite:'18h–06h'};
function vMonth(){const y=A.getFullYear(),m=A.getMonth(),ym=y+'-'+pad(m+1),nd=new Date(y,m+1,0).getDate();
  const l=segs().filter(x=>x.day.slice(0,7)===ym),o=byDay(l),tot=mins(l),ds=Object.keys(o);
  const title=cap(new Date(y,m,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}));
  let body;
  if(!ds.length)body=`<p class="empty">Nenhum estudo registrado em ${title}.</p>`;
  else{const p=periods(l),top=Object.keys(p).sort((a,b)=>p[b]-p[a])[0],best=ds.sort((a,b)=>o[b]-o[a])[0];
    const mx=Math.max(...Object.values(o));let bars='';
    for(let d=1;d<=nd;d++){const v=o[ym+'-'+pad(d)]||0;bars+=`<div title="${d}: ${fmt(v)}"><i style="height:${100*v/mx*.8}%"></i>${d}</div>`}
    body=`<div class="stats">
      <div class="stat"><small>Total no mês</small><b>${fmt(tot)}</b></div>
      <div class="stat"><small>Dias com estudo</small><b>${ds.length} de ${nd}</b></div>
      <div class="stat"><small>Média por dia ativo</small><b>${fmt(tot/ds.length)}</b></div>
      <div class="stat"><small>Melhor dia</small><b>${+best.slice(8)} · ${fmt(o[best])}</b></div></div>
    <p class="hl">Seu período de maior atividade foi a <b>${PN[top].toLowerCase()}</b>, com <b>${fmt(p[top])}</b> (${Math.round(100*p[top]/tot)}% do total).</p>
    <div class="pers">${Object.keys(p).map(k=>`<div class="per${k===top?' top':''}"><small>${PN[k]} · ${PR[k]}</small><b>${fmt(p[k])}</b><small>${Math.round(100*p[k]/tot)}%</small></div>`).join('')}</div>
    <h3>Minutos por dia</h3><div class="days">${bars}</div>`}
  return `<div class="nav"><h2>${title}</h2>${nav()}</div>${body}`}

function vHist(){const L=S.sessions.slice().sort((a,b)=>b.s-a.s),f=flash;flash='';
  let h='',cur='';
  L.slice(0,400).forEach(x=>{const k=dk(x.s);
    if(k!==cur){cur=k;h+=`<div class="hd">${new Date(x.s).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>`}
    h+=`<div class="hi"><span>${hm(x.s)} – ${hm(x.e)}<em>${KL[x.k]||'Foco'}</em></span><b>${fmt((x.e-x.s)/6e4)}</b><button class="x" data-del="${x.id}" aria-label="Excluir registro">Excluir</button></div>`});
  return `<div class="nav"><h2>Histórico</h2></div>`+(L.length?h+`<p class="sum">Total registrado: <b>${fmt(S.sessions.reduce((a,x)=>a+(x.e-x.s)/6e4,0))}</b> em ${L.length} sessões</p>`:`<p class="empty">O histórico está vazio. Cada foco, cronômetro ou registro manual fica salvo aqui.</p>`)}

function vSet(){const c=S.cfg;
  const row=(k,t)=>`<div class="snd"><div class="nm"><b>${t}</b><small>${SND[k]?SND[k].name:'Som padrão'}</small></div><label class="btn">Escolher .mp3<input type="file" accept=".mp3,audio/mpeg" data-snd="${k}"></label><button class="btn" data-play="${k}">Testar</button>${SND[k]?`<button class="btn" data-rm="${k}">Remover</button>`:''}</div>`;
  return `<div class="nav"><h2>Avisos</h2></div>
  <label class="opt"><input type="checkbox" id="o-snd" ${c.snd?'checked':''}>Tocar som quando o período mudar</label>
  <div class="opt"><label for="o-vol">Volume</label><input type="range" id="o-vol" min="0" max="100" value="${c.vol}"><span id="volv">${c.vol}%</span></div>
  <label class="opt"><input type="checkbox" id="o-ntf" ${c.ntf?'checked':''}>Mostrar notificação do navegador</label>
  <p class="er">${ntfMsg}</p>
  <label class="opt"><input type="checkbox" id="o-auto" ${c.auto?'checked':''}>Iniciar o próximo período automaticamente</label>
  <h3>Sons</h3>${row('focus','Início do foco')}${row('break','Início da pausa')}
  <p class="er">${sndMsg}</p><p class="sum">Os arquivos ficam guardados neste navegador (até 10 MB cada). Sem arquivo, toca um bipe padrão.</p>`}

function renderView(){$('#view').innerHTML={day:vDay,week:vWeek,month:vMonth,hist:vHist,set:vSet}[tab]();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab))}
function paintAll(){paintTimer();renderView()}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;renderView();return}
  const a=e.target.closest('[data-act]');if(a){const n=+a.dataset.act;
    if(n===0)A=new Date();
    else if(tab==='day')A=new Date(A.getFullYear(),A.getMonth(),A.getDate()+n);
    else if(tab==='week')A=new Date(A.getFullYear(),A.getMonth(),A.getDate()+7*n);
    else A=new Date(A.getFullYear(),A.getMonth()+n,1);
    renderView();return}
  if(e.target.closest('[data-add]')){addManual();return}
  const u=e.target.closest('[data-ui]');if(u){if(allowed(u.dataset.ui)){S.ui=u.dataset.ui;if(S.ui==='man')prepMan();save();paintAll()}return}
  const pl=e.target.closest('[data-play]');if(pl){play(pl.dataset.play,true);return}
  const rm=e.target.closest('[data-rm]');if(rm){rmSnd(rm.dataset.rm);return}
  const d=e.target.closest('[data-del]');if(d){delSess(d.dataset.del);paintAll()}
});
$('#go').onclick=()=>S.ui==='cron'?cToggle():toggle();$('#stop').onclick=()=>S.ui==='cron'?cStop():stopAll();
$('#cf').value=S.cfg.focus;$('#cb').value=S.cfg.brk;
function cfg(){S.cfg.focus=Math.max(1,Math.min(180,+$('#cf').value||25));S.cfg.brk=Math.max(1,Math.min(60,+$('#cb').value||5));
  if(!S.t.running)S.t.rem=dur(S.t.mode);save();pushCfg();paintTimer()}
$('#cf').onchange=$('#cb').onchange=cfg;

const tip=$('#tip');
function showTip(b,x,y){tip.innerHTML=`<b>${b.dataset.k}</b>Início: ${b.dataset.a}<br>Término: ${b.dataset.b}<br>Total: ${b.dataset.d}`;tip.hidden=false;
  const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.max(4,Math.min(x+14,innerWidth-w-8))+'px';tip.style.top=(y+18+h>innerHeight?y-h-12:y+18)+'px'}
document.addEventListener('pointermove',e=>{const b=e.target.closest&&e.target.closest('.blk');if(b)showTip(b,e.clientX,e.clientY);else tip.hidden=true});
document.addEventListener('focusin',e=>{const b=e.target.closest&&e.target.closest('.blk');if(b){const r=b.getBoundingClientRect();showTip(b,r.left+16,r.top)}});
document.addEventListener('focusout',()=>{tip.hidden=true});
document.addEventListener('input',e=>{if(e.target.id==='o-vol'){S.cfg.vol=+e.target.value;$('#volv').textContent=S.cfg.vol+'%';save()}});
let n=0;
function tick(){const t=S.t;
  if(t.running&&t.end-Date.now()<=0){complete();return}
  paintTimer();
  if((t.running||S.c.running)&&++n%15===0&&(tab==='day'||tab==='week'||tab==='month'))renderView()}
document.addEventListener('change',async e=>{const i=e.target;
  if(i.id==='o-snd'){S.cfg.snd=i.checked;save();pushCfg()}
  else if(i.id==='o-auto'){S.cfg.auto=i.checked;save();pushCfg()}
  else if(i.id==='o-vol'){pushCfg();play('focus',true)}
  else if(i.id==='o-ntf'){ntfMsg='';
    if(i.checked){try{const r=await Notification.requestPermission();S.cfg.ntf=r==='granted';if(!S.cfg.ntf)ntfMsg='Permissão negada. Libere as notificações nas configurações do navegador.'}catch(x){S.cfg.ntf=false;ntfMsg='Notificações indisponíveis neste navegador.'}}
    else S.cfg.ntf=false;
    save();renderView()}
  else if(i.dataset.snd){const f=i.files[0];if(!f)return;
    if(f.size>10*1024*1024){sndMsg='O arquivo passa de 10 MB.';renderView();return}
    try{await idbSet(i.dataset.snd,{f,name:f.name});setSnd(i.dataset.snd,f,f.name);sndMsg=''}catch(x){sndMsg='Não foi possível guardar o arquivo neste navegador.'}
    renderView()}
});
document.addEventListener('visibilitychange',tick);
setInterval(tick,1000);
prepMan();paintAll();tick();
if('serviceWorker' in navigator){
  let waitingWorker=null,notesReady=null,offered=false;
  const updBusy=()=>S.t.running||S.c.running;

  async function fetchChangelog(){
    try{const r=await fetch('changelog.json',{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}
    return null;
  }
  function paintChangelog(d){
    $('#upd-t').textContent=(d&&d.title)||'Nova versão disponível';
    $('#upd-n').innerHTML=(d&&Array.isArray(d.notes)&&d.notes.length?d.notes:['Melhorias e correções.'])
      .map(t=>`<li>${String(t).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</li>`).join('');
  }
  async function offerUpdate(){
    if(!waitingWorker||updBusy())return;
    if(!notesReady)notesReady=await fetchChangelog();
    paintChangelog(notesReady);
    if(!$('#upd').open)$('#upd').showModal();
  }
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(offered)return;offered=true;location.reload();
  });
  $('#upd-go').onclick=()=>{if(waitingWorker)waitingWorker.postMessage('SKIP_WAITING')};
  $('#upd-later').onclick=()=>$('#upd').close();

  navigator.serviceWorker.register('sw.js').then(reg=>{
    if(reg.waiting&&navigator.serviceWorker.controller){waitingWorker=reg.waiting;offerUpdate()}
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;if(!nw)return;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller){waitingWorker=nw;offerUpdate()}
      });
    });
    setInterval(()=>reg.update(),30*60*1000);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){reg.update();offerUpdate()}});
  }).catch(()=>{});

  // Momentos seguros para oferecer a atualização: ao terminar um período do
  // pomodoro, ao encerrar manualmente, ou ao finalizar o cronômetro.
  ['complete','stopAll','cStop'].forEach(fn=>{
    const orig=window[fn];if(typeof orig==='function')window[fn]=function(...a){const r=orig.apply(this,a);offerUpdate();return r};
  });
}
if(tab==='day'){const g=document.querySelector('.grid');}
</script>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,signOut}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import{initializeFirestore,getFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,onSnapshot,writeBatch}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

// COLE AQUI a configuração do seu projeto Firebase (veja o tutorial, passo 3)
const firebaseConfig={
  apiKey:"COLE_AQUI",
  authDomain:"SEU-PROJETO.firebaseapp.com",
  projectId:"SEU-PROJETO",
  appId:"COLE_AQUI"
};

if(firebaseConfig.apiKey==='COLE_AQUI'){setAcct({mode:'off'})}
else{
  const app=initializeApp(firebaseConfig),auth=getAuth(app);
  let db;try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=getFirestore(app)}
  const d=id=>document.getElementById(id),dlg=d('dlg'),er=d('dl-err');
  const T=(s,e,k)=>({s,e,k:k||'pomo'});
  let unsub=[];
  onAuthStateChanged(auth,u=>{
    unsub.forEach(f=>f());unsub=[];
    if(!u){setCloud(null);setAcct({mode:'out'});return}
    if(dlg.open)dlg.close();
    const sc=collection(db,'users',u.uid,'sessions'),cd=doc(db,'users',u.uid,'meta','settings');
    setCloud({
      set:o=>setDoc(doc(sc,o.id),T(o.s,o.e,o.k)).catch(console.error),
      del:id=>deleteDoc(doc(sc,id)).catch(console.error),
      cfg:c=>setDoc(cd,c).catch(console.error)
    });
    let first=true;
    unsub.push(onSnapshot(sc,snap=>{
      const arr=snap.docs.map(x=>({id:x.id,...x.data()}));
      if(first){first=false;
        if(migKey()!==u.uid){
          const ids=new Set(arr.map(x=>x.id)),extra=localSessions().filter(x=>!ids.has(x.id));
          for(let i=0;i<extra.length;i+=400){const b=writeBatch(db);extra.slice(i,i+400).forEach(x=>b.set(doc(sc,x.id),T(x.s,x.e,x.k)));b.commit().catch(console.error)}
          arr.push(...extra);setMig(u.uid)}}
      applySessions(arr);
      setAcct({mode:'in',email:u.email,pending:snap.metadata.hasPendingWrites,fromCache:snap.metadata.fromCache})
    },()=>setAcct({mode:'in',email:u.email,err:true})));
    unsub.push(onSnapshot(cd,s=>{if(s.exists())applyCfg(s.data());else pushCfg()}));
  });
  const msg=e=>({'auth/invalid-credential':'E-mail ou senha incorretos.','auth/email-already-in-use':'Esse e-mail já tem conta. Use Entrar.','auth/weak-password':'A senha precisa ter ao menos 6 caracteres.','auth/invalid-email':'E-mail inválido.','auth/missing-password':'Informe a senha.','auth/popup-closed-by-user':'','auth/unauthorized-domain':'Domínio não autorizado no Firebase (veja o tutorial, passo 7).'}[e.code]??('Não foi possível entrar ('+e.code+').'));
  const run=async f=>{er.textContent='';try{await f()}catch(e){er.textContent=msg(e)}};
  d('btn-in').onclick=()=>run(()=>signInWithEmailAndPassword(auth,d('em').value,d('pw').value));
  d('btn-new').onclick=()=>run(()=>createUserWithEmailAndPassword(auth,d('em').value,d('pw').value));
  d('btn-g').onclick=()=>run(()=>signInWithPopup(auth,new GoogleAuthProvider()));
  d('btn-x').onclick=()=>dlg.close();
  document.addEventListener('click',async e=>{
    if(e.target.closest('[data-login]')){er.textContent='';dlg.showModal()}
    if(e.target.closest('[data-logout]')){await signOut(auth);clearLocal()}
  });
}
</script>
